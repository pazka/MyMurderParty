# Read ONCE by `hosh-deploy register my-murder-party` on the box (box standard, Decision #16), which
# validates the compose hardening and pins the result in /etc/hosh-deploy/apps/my-murder-party.conf.
# Changing this file in the repo changes nothing on the box until someone re-registers there.
SERVICE=my-murder-party
IMAGE_REPO=ghcr.io/pazka/my-murder-party
IMAGE_VAR=APP_IMAGE
ENV_FILE=my-murder-party.env
HOST=murder.hosh.it
BIND=127.0.0.1:9137
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (argv, no shell; non-zero ⇒ auto-rollback).
# Read-only (creates no user or room): front, /info, /healthz, /rooms + /users shapes, PROD CORS, socket.io connect.
POST_DEPLOY=node /app/ops/smoke.js http://127.0.0.1:8000
REPO=pazka/MyMurderParty
