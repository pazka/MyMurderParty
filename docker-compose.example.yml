# my-murder-party on the hosh.it box (no secrets here). On the box it becomes
# /srv/my-murder-party/docker-compose.yml, validated and pinned by `hosh-deploy register`.
# Box standard (hosh-migration 11-BOX-STANDARD.md): published on a LOOPBACK port only; the edge
# Traefik (host network, file provider) routes murder.hosh.it to it (route rendered by
# hosh-deploy from deploy/traefik-route.yml.tmpl).
# No volume: all game state is in memory (a restart or a deploy ends every game, as before);
# nothing is ever written to disk.
name: my-murder-party
services:
  my-murder-party:
    image: ${APP_IMAGE:-ghcr.io/pazka/my-murder-party:latest}
    container_name: my-murder-party
    restart: unless-stopped
    env_file: ./my-murder-party.env          # chmod 600
    environment:
      PORT: "8000"                           # box convention; the image's own default stays 80 (legacy compose)
    # --- hardening (box standard) ---
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      # no curl in the image: node itself checks GET /healthz (200 + "status":"ok")
      test: ["CMD", "node", "/app/ops/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "${APP_BIND:-127.0.0.1:9137}:8000"   # loopback only, never 0.0.0.0
